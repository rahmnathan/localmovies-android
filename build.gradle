// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.3.0'
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.2'
        classpath 'com.google.gms:google-services:4.4.4'
        // Note: kotlin-gradle-plugin no longer needed with AGP 9.0+ built-in Kotlin support
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.58'
    }
}

plugins {
    id 'com.google.devtools.ksp' version '2.3.6' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.0' apply false
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.getLayout().getBuildDirectory()
}
