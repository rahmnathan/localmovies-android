android.useAndroidX=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4046m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# LocalMovie generated API client artifact version (published by backend Jenkins)
# Leave blank to disable generated client dependency until a published version is available.
localmovieApiClientVersion=7.122

# AGP 9.0+ built-in Kotlin support (requires newDsl=false for Hilt compatibility)
android.builtInKotlin=true
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Suppress AGP warnings for settings required for Hilt compatibility
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
